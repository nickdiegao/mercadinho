# Postgres para rodar o sistema no proprio computador.
#
#   npm run banco:subir     liga o banco
#   npm run banco:preparar  cria as tabelas e carrega os dados da demonstracao
#
# Os dados ficam no volume "mercadinho-dados", guardado pelo Docker — fora da
# pasta do projeto de proposito: o OneDrive sincronizando os arquivos de um
# Postgres ligado corrompe o banco.
#
# A porta so abre em 127.0.0.1 (nao aparece na rede), por isso a senha abaixo
# pode ser fixa: e um banco de desenvolvimento. Em producao, senha de verdade
# em variavel de ambiente.

services:
  banco:
    image: postgres:17-alpine
    container_name: mercadinho-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercadinho
      POSTGRES_PASSWORD: mercadinho_local
      POSTGRES_DB: mercadinho
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mercadinho-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadinho -d mercadinho"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mercadinho-dados:
